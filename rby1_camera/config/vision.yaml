# rby1_camera 통합 설정 파일.
# 두 노드(apriltag_node, depth_tag_tf_node)의 파라미터를 한 파일에서 관리한다.
# /** 섹션은 두 노드에 공통 적용되고, 각 노드 섹션은 해당 노드만 읽는다.
# depth의 원점은 front glass에서 4.2mm 안쪽, 중심에서 17.5mm왼쪽
# 두 노드가 공통으로 사용하는 태그 검은색 테두리의 한 변 길이 [m].
/**:
  ros__parameters:
    size: 0.024

# ── apriltag_ros (PnP 기반 태그 검출/포즈) ──────────────────────────
apriltag_node:
  ros__parameters:
    # 사용할 마커 종류 (기본값)
    family: "36h11"
    # 3D 좌표계(TF)를 ROS 네트워크로 송출 (tag36h11:<id> 프레임)
    publish_tf: true
    # 이미지 전송 시 압축하지 않고 원본 사용
    image_transport: "raw"

# ── depth_tag_tf_node (depth 기반 + PnP 재가공) ─────────────────────
depth_tag_tf_node:
  ros__parameters:
    # ---- 공통 (depth/PnP 둘 다 적용) ----
    # 태그 포즈를 최종적으로 표현할 TF 기준 프레임.
    # 빈 문자열이면 입력 depth image의 frame_id(보통
    # camera_color_optical_frame)를 그대로 사용한다.
    output_frame: "ee_left"

    # true: CameraInfo.D(plumb_bob)로 raw color 픽셀을 왜곡 보정한 뒤
    #       depth 역투영과 tag_pnp_* 포즈 계산에 사용.
    # false: 기존과 동일하게 D를 적용하지 않음. tag_pnp_*는
    #        apriltag_ros가 발행한 tag36h11:<id> TF를 재사용.
    apply_distortion_correction: true

    # false: 매 프레임 실시간으로 TF/PoseArray 퍼블리시
    # true:  평소엔 대기, /capture 신호를 받으면 samples_per_trigger 프레임을
    #        수집해 평균 포즈를 한 번만 퍼블리시 (static TF + PoseArray)
    # 트리거 보내기: ros2 topic pub --once /capture std_msgs/msg/Empty "{}"
    # 주의: demo4의 자동 평균은 이 trigger_mode가 아니라
    # rby1_planner/config/default.yaml의 object_pose_average_*를 사용합니다.
    trigger_mode: false
    # 트리거 모드에서 평균에 사용할 유효 프레임 수
    samples_per_trigger: 100
    # 트리거 모드에서 평균 전에 버릴 outlier 비율.
    # 0.0 = 안 버림, 0.2 = 20% 버림 (100장이면 위치/자세 각각 중앙값에서
    # 먼 순서로 20장을 버리고 80장으로 평균). 최대 0.9.
    outlier_trim_ratio: 0.2

    # ---- depth 기반 (tag_depth_<id>) ----
    tf_prefix: "tag_depth_"
    # 코너 depth를 읽을 때 사용할 정사각 윈도 반경 (1이면 3x3 중앙값)
    depth_window_radius: 1
    # 태그 프레임에 추가로 곱할 회전 오프셋 [roll, pitch, yaw] (단위: 도).
    # [180.0, 0.0, 0.0] = 기존 apply_flip: true와 동일 (X축 기준 180도 반전).
    # [0.0, 0.0, 0.0]   = 오프셋 없음 (기존 apply_flip: false).
    # 임의 축 치환도 가능: 예) [90.0, 0.0, -90.0]
    # RViz 정상 기준: 태그 정면에서 Z(파랑)가 카메라 쪽, Y(초록)가 위.
    rotation_offset_rpy_deg: [180.0, 180.0, 180.0]

    # ---- PnP 기반 재가공 (tag_pnp_<id>) ----
    # apriltag_ros가 쏜 TF(tag36h11:<id>)를 조회해 같은 트리거/평균 파이프라인에 태움
    pnp_enable: true
    pnp_tf_prefix: "tag_pnp_"
    # apriltag_ros가 만드는 태그 프레임 이름 형식 (family를 바꾸면 여기도 맞출 것)
    pnp_tag_frame_format: "tag36h11:{id}"
    # PnP 포즈에 곱할 회전 오프셋 [roll, pitch, yaw] (단위: 도).
    # depth 축(tag_depth_*)과 PnP 축(tag_pnp_*)이 어긋나 보이면 여기로 맞출 것.
    pnp_rotation_offset_rpy_deg: [180.0, 180.0, 180.0]
