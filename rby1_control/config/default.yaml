/**:
  ros__parameters:
    # Relative names are resolved inside the node namespace, normally /rby1.
    # Navigation and other velocity producers publish raw commands. This node
    # is the only owner of the final driver-facing cmd_vel topic.
    cmd_raw_topic: cmd_raw
    cmd_vel_topic: cmd_vel
    robot_state_topic: robot_state

    # Versioned std_msgs/String bridge used by the independent planner.
    control_command_topic: control/command
    control_state_topic: control/state
    control_event_topic: control/event
    control_response_topic: control/response
    control_state_publish_rate_hz: 20.0
    control_state_timeout_sec: 1.0

    # PowerServoStateAdaptor polls the SDK asynchronously through RobotSession.
    # robot_address is normally supplied by control.launch.py.
    robot_address: ""
    robot_model: m
    power_pattern: ".*"
    servo_pattern: ".*"
    power_servo_poll_period_sec: 0.5
    power_servo_feedback_timeout_sec: 1.5

    # Normalized rby1_gripper_driver interface. Arrays use [right, left]
    # ordering. Close ratios: 0.0=open, 1.0=closed.
    gripper_command_topic: gripper/command
    gripper_state_topic: gripper/state
    gripper_ready_topic: gripper/ready
    gripper_open_ratio: 0.0
    gripper_close_ratio: 1.0
    gripper_state_timeout_sec: 1.0
    gripper_command_timeout_sec: 5.0
    gripper_goal_tolerance: 0.05
    # Commanded gripper speed is normalized close-ratio change per second.
    # Acceleration is shared so Task/UI callers only choose a speed. Start
    # physical commissioning at 20 Hz and raise it only after verification.
    gripper_default_speed_ratio_per_sec: 1.5
    gripper_max_speed_ratio_per_sec: 2.0
    gripper_acceleration_ratio_per_sec2: 4.0
    gripper_trajectory_rate_hz: 100.0
    gripper_tracking_timeout_margin_sec: 5.0
    gripper_home_service: gripper/home
    gripper_torque_service: gripper/torque_enable

    # Gripper power is intentionally fixed to 12 V. Never change this to
    # 24 V: both tool flanges feed the gripper electronics directly.
    tool_flange_power_service: tool_flange_power
    tool_flange_right_state_topic: tool_flange/right
    tool_flange_left_state_topic: tool_flange/left
    tool_flange_state_timeout_sec: 1.5

    robot_power_service: robot_power
    robot_servo_service: robot_servo
    stream_control_service: stream_control
    control_manager_service: control_manager_command

    # Set false to use the backend in generic cmd_vel-only mode.
    use_rby1_services: true

    # The original mobile-base example publishes about 25 Hz.
    publish_rate_hz: 25.0

    # Safety watchdog: stale non-zero commands are replaced with zero Twist.
    command_timeout_sec: 0.35
    publish_zero_when_idle: true

    # RB-Y1 driver manipulation and Scenario safety interfaces.
    joint_action: robot_joint
    cartesian_action: robot_cartesian
    cartesian_pose_service: get_cartesian_pose
    cancel_control_service: cancel_control
    scenario_safety_capabilities_service: scenario_safety_capabilities

    right_arm_joint_state_topic: joint_states/right_arm
    left_arm_joint_state_topic: joint_states/left_arm
    torso_joint_state_topic: joint_states/torso
    head_joint_state_topic: joint_states/head

    right_cartesian_ref_link: base
    right_cartesian_target_link: ee_right
    left_cartesian_ref_link: base
    left_cartesian_target_link: ee_left
    # Torso Cartesian steps (linear_absolute/relative with group "torso").
    torso_cartesian_ref_link: base
    torso_cartesian_target_link: link_torso_5

    # Joint impedance (Task steps with impedance= and the Joint tab's
    # Control: Impedance mode).
    # After an impedance command completes, hold the measured joint state
    # with position control so no spring force remains.
    impedance_reanchor_enabled: true
    impedance_reanchor_minimum_time_sec: 0.3
    # Cartesian impedance (contact helpers, Joint tab CS Impedance mode):
    # the TCP target is solved to a joint target on stream_path_model_file
    # and tracked with joint impedance. Targets farther than this from the
    # measured TCP pose are rejected; approach with position control first.
    cartesian_impedance_max_translation_m: 0.1
    cartesian_impedance_max_rotation_deg: 20.0
    # Goal watchdog: a manipulation goal still active after
    # expected_duration * scale + margin is cancelled with an error event.
    motion_goal_timeout_scale: 3.0
    motion_goal_timeout_margin_sec: 2.0

    cartesian_state_period_sec: 0.25
    # Joint-space policy used by both JS hard-limit validation and the CS
    # runtime guard. Relative paths resolve inside this package's config dir.
    joint_limits_file: joint_limits_rby1m_v1_3.yaml
    # CS only: inset both physical bounds by this many degrees.
    cartesian_joint_limit_margin_deg: 1.0
    # CS only: stop if the active arm's JointState is older than this value.
    cartesian_joint_state_timeout_sec: 0.1
    joint_jog_minimum_time_sec: 1.0
    cartesian_jog_minimum_time_sec: 1.0

    # Explicit non-zero driver fields for manual MOVE TARGET and jog commands.
    manual_joint_velocity_limit: 0.2
    manual_joint_acceleration_limit: 0.2
    manual_cartesian_linear_velocity_limit: 0.05
    manual_cartesian_angular_velocity_limit: 0.2
    manual_cartesian_acceleration_scaling: 0.2

    # Streamed Cartesian path (Task linear_path_relative / linear_path_absolute
    # steps). The Task runner turns the driver stream on only for these steps
    # and off again before the next step. The driver's own stream_cartesian
    # IK does not converge on this robot, so this node solves the arm IK on
    # the SDK dynamics model and streams joint targets through stream_joint.
    # Keep stream_path_rate_hz at or below the driver's stream_hz
    # (rby1_driver driver_parameters.yaml, 30).
    stream_joint_action: stream_joint
    # Robot description as served by the SDK (Robot.get_robot_model()).
    # Relative paths resolve inside this package's config dir.
    stream_path_model_file: rby1m_v1_3_sdk_model.urdf
    stream_path_rate_hz: 20.0
    # Horizon handed to the driver with every target. Slightly longer than one
    # tick so consecutive targets blend instead of stopping at each one.
    stream_path_tick_minimum_time_sec: 0.1
    # Stop the path if this backend fails to send a target within this time.
    # The driver's own 1 s stream timeout is only the last line of defense.
    stream_path_watchdog_sec: 0.25
    # Keep sending the final target for this long before reporting success.
    stream_path_settle_sec: 0.3
    # Hard caps: a path whose own velocity limits exceed these is rejected.
    stream_path_linear_velocity_limit: 0.1
    stream_path_angular_velocity_limit: 0.5
    # IK acceptance: every waypoint is solved before motion starts and every
    # tick target again while streaming. A target that does not converge
    # within these tolerances stops the path.
    stream_path_ik_max_iterations: 30
    stream_path_ik_position_tolerance_m: 0.0005
    stream_path_ik_orientation_tolerance_rad: 0.002
    # Largest joint change allowed between consecutive streamed targets.
    stream_path_max_joint_step_rad: 0.05
