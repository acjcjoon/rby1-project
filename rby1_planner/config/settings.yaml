# Task 구성 시작 지점 (지점 참조). 실제 로봇 위치가 아니며 파일은 바뀌지 않는다.
current_location: LH1

# 이동 중(turn_and_move, SLAM) 머리 pitch 절대각 (deg, + = 숙임). 도착 후 각도는 지점별 head_pitch_deg.
head_pitch_deg: {move: 2.0}

# ── 장비 ──
# kind: plain = 그냥 집기/놓기, door_switch = 문/스위치를 거쳐 집기/놓기
# points: 장비 안의 이동 지점. position 은 공통 좌표계 [x, y] m
#         (원점 = ZS.work, 축 = base 180° 회전 배치의 base 축. base 방향은 모든 지점에서 같다)
#         side 는 그 지점에서의 허리 방향 (front / left / right)
#         head_pitch_deg 는 그 지점에서의 머리 pitch 절대각 (deg, + = 숙임). 없으면 0
# place: 집기/놓기 지점과 태그. offset 은 태그 -> 지점 중앙 보정 [x, y, z] m
# work: (door_switch) work 지점에서 하는 문/스위치 작업 설정
# 지점 참조: 'LH1' (= LH1 의 place 지점) 또는 'ZS.work'. 태그 ID 는 장비 전체에서 한 번만 쓴다.
stations:
  LH1:
    kind: plain
    points: {place: {position: [0.4, 0.0], side: front, head_pitch_deg: 32}}
    place: {point: place, tag: tag_3, offset: [-0.05, 0.061, -0.009]}
  LH2:
    kind: plain
    points: {place: {position: [0.4, 0.81], side: right, head_pitch_deg: 32}}
    place: {point: place, tag: tag_0, offset: [-0.05, 0.061, -0.009]}
  ZS:
    kind: door_switch
    points:
      work:  {position: [0.0, 0.0],   side: left,  head_pitch_deg: 32}  # 문/스위치 작업 위치 (구 ZSSW)
      via:   {position: [-0.75, 0.0], side: left,  head_pitch_deg: 2}   # 경유 지점 (구 AP)
      place: {position: [-0.75, 0.70], side: front, head_pitch_deg: 47}  # 놓는 위치 (구 ZS)
    route: [work, via, place]                        # 작업 위치 -> 놓는 위치. 복귀는 역순
    place:  {point: place, tag: tag_2, offset: [-0.05, 0.061, -0.009]}
    work:
      # 벽 좌표 = 태그 축과 같은 [x 벽 따라 수평, y 위, z 벽에서 로봇 쪽] m.
      # wall_yaw_deg: work 지점에서 본 벽 방향 (base XY, 0 = +x, 90 = +y). 배치가 바뀌면 이 값만 고친다.
      wall_yaw_deg: 90.0
      door:
        hinge_to_handle_wall: [0.18975, 0.0, 0.0325]   # 닫힘 상태 경첩 -> 손잡이 중심, 벽 좌표 (m)
        swing_deg: 90.0
        # ee_offset_tag: 태그 -> 손(ee_right) 위치, 태그 축 [x 벽 따라 수평, y 위, z 벽에서 로봇 쪽] m
        open:  {tag: tag_6, base_align_xy: [0.619, -0.326],   ee_offset_tag: [0.02, 0.09, 0.02]}
        close: {tag: tag_7, base_align_xy: [0.4188, -0.1004], ee_offset_tag: [0.02, 0.08, 0.006]}
      switch: {tag: tag_5, button_offset_in_tag: [0.0, 0.0], approach_standoff_m: 0.08, press_depth_m: 0.01}  # 접근: 태그 z 0.08 m, 누름: 거기서 벽 쪽으로 press_depth_m
  # 아래는 실제 위치/태그 보정 전의 자리표시자 (enabled: false 동안 사용 불가).
  MPR:   {enabled: false, kind: plain, points: {place: {position: [0.0, 0.0], side: left, head_pitch_deg: 32}}, place: {point: place, tag: null}}
  INC:   {enabled: false, kind: plain, points: {place: {position: [0.0, 0.0], side: left, head_pitch_deg: 32}}, place: {point: place, tag: null}}
  WASTE: {enabled: false, kind: plain, points: {place: {position: [0.0, 0.0], side: left, head_pitch_deg: 32}}, place: {point: place, tag: null}}


# 임피던스 프리셋. Task 에서 impedance=True 이면 "default", impedance="contact" 처럼
# 이름을 주면 그 프리셋을 쓴다. 값을 고치고 UI 에서 Reload Tasks 만 하면 반영된다.
# Joint 탭 Impedance 입력란의 초기값도 "default" 에서 읽는다.
#   stiffness     : 관절별 강성 [Nm/rad], 팔 7개 (0 ~ 1000)
#   damping_ratio : 감쇠비 (0 < x <= 5)
#   torque_limit  : 관절 토크 상한 [Nm] (0 < x <= 50). 누르는 힘의 상한이자 팔이
#                   자세를 버티는 힘의 상한이다. 팔을 수평으로 뻗은 자세에서는
#                   어깨 중력 토크만 20~25 Nm 이므로 그보다 낮으면 팔이 처진다.
#   hold_time     : 목표 도달 후 임피던스 목표를 유지하는 시간 [s] (0 ~ 10)
impedance_presets:
  default:
    stiffness: [80.0, 80.0, 60.0, 60.0, 30.0, 30.0, 20.0]
    damping_ratio: 1.0
    torque_limit: 10.0
    hold_time: 0.0
  contact:
    stiffness: [80.0, 80.0, 60.0, 60.0, 30.0, 30.0, 20.0]
    damping_ratio: 1.0
    torque_limit: 5.0
    hold_time: 0.5
  # 문 열기(door_open_right_arm_impedance): 팔 자중 + 문 저항을 버텨야 한다.
  # 손이 처지면 올리고, 손잡이를 너무 세게 끌면(문과 다투면) 내린다.
  door:
    stiffness: [240.0, 240.0, 180.0, 180.0, 90.0, 90.0, 60.0]
    damping_ratio: 1.0
    torque_limit: 25.0
    hold_time: 0.0
