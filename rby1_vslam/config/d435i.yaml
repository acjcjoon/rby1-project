/**:
  ros__parameters:
    camera_name: d435
    device_type: d435i
    enable_infra1: true
    enable_infra2: true
    # release/4.51.1-isaac uses one profile for the depth/IR module (Y8 IR).
    depth_module.profile: '640,360,30'
    depth_module.emitter_enabled: 0
    depth_module.enable_auto_exposure: true
    enable_color: false
    enable_depth: false
    # Isaac ROS synchronizes the two IR streams locally.
    enable_sync: false
    align_depth.enable: false
    pointcloud.enable: false
    enable_gyro: false
    enable_accel: false
    gyro_fps: 200
    accel_fps: 100
    unite_imu_method: 0
    publish_tf: true
    tf_publish_rate: 0.0
    rgb_camera.profile: '640,480,30'
