/nvblox_node:
  ros__parameters:
    # Wheel odometry remains the sole odom->base authority. Full timestamped
    # torso/head TF supplies the camera pose; cuVSLAM station policy is unchanged.
    global_frame: odom
    use_tf_transforms: true
    use_topic_transforms: false
    num_cameras: 1
    use_depth: true
    use_color: false
    use_lidar: false
    input_qos: SENSOR_DATA
    mapping_type: static_tsdf
    voxel_size: 0.05
    cuda_stream_type: 1
    tick_period_ms: 10
    integrate_depth_rate_hz: 45.0
    integrate_color_rate_hz: 0.0
    integrate_lidar_rate_hz: 0.0
    update_esdf_rate_hz: 10.0
    update_mesh_rate_hz: 5.0
    publish_layer_rate_hz: 5.0
    publish_debug_vis_rate_hz: 2.0
    # Retain previously surveyed corridors in this static-obstacle experiment.
    # Removed objects clear when observed again; this is not dynamic mapping.
    decay_tsdf_rate_hz: 0.0
    decay_dynamic_occupancy_rate_hz: 0.0
    clear_map_outside_radius_rate_hz: 1.0
    map_clearing_radius_m: 12.0
    map_clearing_frame_id: base
    maximum_input_queue_length: 10
    esdf_mode: 2d
    publish_esdf_distance_slice: true
    output_pessimistic_distance_map: false
    esdf_slice_bounds_visualization_attachment_frame_id: base
    esdf_slice_bounds_visualization_side_length: 10.0
    workspace_height_bounds_visualization_attachment_frame_id: base
    workspace_height_bounds_visualization_side_length: 10.0
    layer_visualization_min_tsdf_weight: 0.1
    layer_visualization_exclusion_height_m: 2.0
    layer_visualization_exclusion_radius_m: 12.0
    max_back_projection_distance: 5.0
    # Integrated depth cloud also acts as the navigation integration watchdog.
    back_projection_subsampling: 4
    layer_streamer_bandwidth_limit_mbps: 20.0
    print_rates_to_console: true
    print_delays_to_console: true
    print_queue_drops_to_console: true
    print_statistics_on_console_period_ms: 10000
    static_mapper:
      # release-3.2 depth-only preprocessing asserts on an empty mask. Verified
      # with a real GPU run; leave disabled for the unsegmented camera pipeline.
      do_depth_preprocessing: false
      depth_preprocessing_num_dilations: 1
      projective_integrator_max_integration_distance_m: 5.0
      projective_integrator_truncation_distance_vox: 4.0
      projective_integrator_weighting_mode: inverse_square_tsdf_distance_penalty
      projective_integrator_max_weight: 5.0
      esdf_integrator_min_weight: 0.1
      esdf_integrator_max_site_distance_vox: 2.0
      esdf_integrator_max_distance_m: 2.0
      # Heights are in the floor-aligned odom frame, not the head camera frame.
      # Verify floor rejection / low obstacles in RViz before enabling Nav2.
      esdf_slice_height: 0.0
      esdf_slice_min_height: 0.08
      esdf_slice_max_height: 1.8
      mesh_integrator_min_weight: 0.1
      mesh_integrator_weld_vertices: true
      layer_streamer_exclusion_height_m: 2.0
      layer_streamer_exclusion_radius_m: 12.0
