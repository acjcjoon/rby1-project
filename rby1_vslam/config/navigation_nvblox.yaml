# Overlay on navigation.yaml, applied only with use_nvblox:=true.
# Existing wheel transit / stationary visual correction stays unchanged.
controller_server:
  ros__parameters:
    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      desired_linear_vel: 0.10
      lookahead_dist: 0.30
      min_lookahead_dist: 0.20
      max_lookahead_dist: 0.50
      lookahead_time: 1.5
      use_velocity_scaled_lookahead_dist: false
      transform_tolerance: 0.20
      min_approach_linear_velocity: 0.02
      approach_velocity_scaling_dist: 0.50
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 2.0
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.60
      regulated_linear_scaling_min_speed: 0.03
      use_cost_regulated_linear_velocity_scaling: true
      cost_scaling_dist: 0.60
      cost_scaling_gain: 0.5
      inflation_cost_scaling_factor: 3.0
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.35
      rotate_to_heading_angular_vel: 0.20
      max_angular_accel: 0.30
      allow_reversing: false
      max_robot_pose_search_dist: 5.0
local_costmap:
  local_costmap:
    ros__parameters:
      publish_frequency: 5.0
      track_unknown_space: true
      nvblox_layer:
        plugin: nvblox::nav2::NvbloxCostmapLayer
        enabled: true
        nav2_costmap_global_frame: odom
        nvblox_map_slice_topic: /nvblox_node/static_map_slice
        convert_to_binary_costmap: true
global_costmap:
  global_costmap:
    ros__parameters:
      track_unknown_space: true
      nvblox_layer:
        plugin: nvblox::nav2::NvbloxCostmapLayer
        enabled: true
        nav2_costmap_global_frame: vslam_map
        nvblox_map_slice_topic: /nvblox_node/static_map_slice
        convert_to_binary_costmap: true
velocity_smoother:
  ros__parameters:
    # Closed-loop odometry is still the body-frame wheel adapter.
    max_velocity: [0.12, 0.0, 0.25]
    min_velocity: [0.0, 0.0, -0.25]
    max_accel: [0.15, 0.15, 0.30]
    max_decel: [-0.20, -0.20, -0.40]
