# Humble station navigation: map->odom is frozen for the entire transit.
# The wheel driver supplies odom->base and controller velocity feedback.
# UI sends one NavigateToPose per station, then holds for visual correction/work.
bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: vslam_map
    robot_base_frame: base
    odom_topic: /rby1/vslam/wheel_odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_rate_controller_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_remove_passed_goals_action_bt_node
controller_server:
  ros__parameters:
    use_sim_time: false
    odom_topic: /rby1/vslam/wheel_odom
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    # Allow a brief TF/costmap interruption before aborting the action.
    failure_tolerance: 1.0
    progress_checker_plugin: progress_checker
    goal_checker_plugins: [goal_checker]
    controller_plugins: [FollowPath]
    progress_checker:
      # Count meaningful rotation as progress and allow fine final correction for 30 s.
      plugin: nav2_controller::PoseProgressChecker
      required_movement_radius: 0.03
      required_movement_angle: 0.0523599  # 3 degrees
      movement_time_allowance: 30.0
    goal_checker:
      plugin: nav2_controller::StoppedGoalChecker
      xy_goal_tolerance: 0.02
      yaw_goal_tolerance: 0.0349066  # 2 degrees; tune against measured station repeatability.
      # Require position and heading tolerances at the same time.
      stateful: false
      trans_stopped_velocity: 0.01
      rot_stopped_velocity: 0.015
    FollowPath:
      plugin: rby1_omni_controller::OmniPursuitController
      # Holonomic pursuit: hold the departure yaw while translating along the path.
      # At the station, stop translation and align to the saved goal yaw.
      # ROS body axes: +x forward, +y left, +yaw counterclockwise.
      desired_linear_vel: 0.10
      max_x_vel: 0.12
      max_y_vel: 0.08
      max_angular_vel: 0.25
      linear_accel: 0.15
      linear_decel: 0.20
      angular_accel: 0.30
      angular_decel: 0.40
      lookahead_dist: 0.30
      approach_dist: 0.30
      hold_yaw_kp: 1.5
      final_yaw_kp: 1.5
      transform_tolerance: 0.20
      collision_horizon: 1.0
      inactive_reset_timeout: 1.0
      goal_change_position_tolerance: 0.001
      goal_change_yaw_tolerance: 0.001

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 10.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base
      transform_tolerance: 0.3
      rolling_window: true
      width: 5
      height: 5
      resolution: 0.05
      # RBY1 mecanum base: x is forward (695 mm), y is left (600 mm).
      footprint: "[[0.3475, 0.3000], [0.3475, -0.3000], [-0.3475, -0.3000], [-0.3475, 0.3000]]"
      footprint_padding: 0.05
      track_unknown_space: true
      plugins: [obstacle_layer, inflation_layer]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          marking: true
          clearing: true
          inf_is_valid: true
          max_obstacle_height: 2.0
          obstacle_max_range: 8.0
          obstacle_min_range: 0.05
          raytrace_max_range: 10.0
          raytrace_min_range: 0.05
          expected_update_rate: 0.5
          observation_persistence: 0.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.75
        cost_scaling_factor: 3.0
      always_send_full_costmap: true
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: vslam_map
      robot_base_frame: base
      transform_tolerance: 0.3
      rolling_window: true
      width: 20
      height: 20
      resolution: 0.05
      # Match the local costmap's physical RBY1 mecanum-base footprint.
      footprint: "[[0.3475, 0.3000], [0.3475, -0.3000], [-0.3475, -0.3000], [-0.3475, 0.3000]]"
      footprint_padding: 0.05
      track_unknown_space: true
      plugins: [obstacle_layer, inflation_layer]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          marking: true
          clearing: true
          inf_is_valid: true
          max_obstacle_height: 2.0
          obstacle_max_range: 8.0
          obstacle_min_range: 0.05
          raytrace_max_range: 10.0
          raytrace_min_range: 0.05
          expected_update_rate: 0.5
          observation_persistence: 0.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.75
        cost_scaling_factor: 3.0
      always_send_full_costmap: true
planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 1.0
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_navfn_planner/NavfnPlanner
      use_astar: true
      # A station must be reachable at its saved pose, not a nearby substitute.
      tolerance: 0.0
      allow_unknown: false
      use_final_approach_orientation: false
smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: [simple_smoother]
    simple_smoother:
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true
behavior_server:
  ros__parameters:
    use_sim_time: false
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    # No autonomous spin/backup recovery around a workstation.
    behavior_plugins: [wait]
    wait:
      plugin: nav2_behaviors/Wait
    global_frame: odom
    robot_base_frame: base
    transform_tolerance: 0.3
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.25
    min_rotational_vel: 0.05
    rotational_acc_lim: 0.4
waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: true
    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint:
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      enabled: true
      waypoint_pause_duration: 0
velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: true
    feedback: CLOSED_LOOP
    # Match the omni plugin; feedback twist is corrected into the body frame.
    max_velocity: [0.12, 0.08, 0.25]
    min_velocity: [-0.12, -0.08, -0.25]
    max_accel: [0.15, 0.15, 0.3]
    max_decel: [-0.2, -0.2, -0.4]
    odom_topic: /rby1/vslam/wheel_odom
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 0.25
