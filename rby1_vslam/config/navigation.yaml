# Humble Nav2. VSLAM supplies map->odom; wheel odometry supplies odom->base.
bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: vslam_map
    robot_base_frame: base
    odom_topic: /rby1/odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_rate_controller_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_recovery_node_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_remove_passed_goals_action_bt_node
controller_server:
  ros__parameters:
    use_sim_time: false
    odom_topic: /rby1/odom
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    # Tolerate a short MPPI retry without immediately aborting the action.
    failure_tolerance: 1.0
    progress_checker_plugin: progress_checker
    goal_checker_plugins: [goal_checker]
    controller_plugins: [FollowPath]
    progress_checker:
      # Count meaningful rotation as progress and allow fine final correction for 30 s.
      plugin: nav2_controller::PoseProgressChecker
      required_movement_radius: 0.03
      required_movement_angle: 0.0523599  # 3 degrees
      movement_time_allowance: 30.0
    goal_checker:
      plugin: nav2_controller::StoppedGoalChecker
      xy_goal_tolerance: 0.01
      yaw_goal_tolerance: 0.0174533  # 1 degree
      # Require position and heading tolerances at the same time.
      stateful: false
      trans_stopped_velocity: 0.02
      rot_stopped_velocity: 0.02
    FollowPath:
      plugin: nav2_mppi_controller::MPPIController
      # Match the 20 Hz period exactly to enable Humble's sequence shifting.
      model_dt: 0.05
      time_steps: 56          # 2.8 s prediction horizon
      batch_size: 1000       # Raise only after the 20 Hz deadline is measured on the UPC.
      iteration_count: 1
      temperature: 0.3
      gamma: 0.015
      # Preserve the former 0.15 m/s planar-speed envelope even on diagonal commands.
      vx_max: 0.12
      vx_min: -0.10
      vy_max: 0.08
      wz_max: 0.35
      vx_std: 0.06
      vy_std: 0.04
      wz_std: 0.15
      motion_model: "Omni"
      prune_distance: 1.5
      max_robot_pose_search_dist: 2.0
      transform_tolerance: 0.3
      retry_attempt_limit: 1
      reset_period: 1.0      # Humble-only optimizer inactivity reset
      regenerate_noises: false
      visualize: false
      critics: [ConstraintCritic, CostCritic, GoalCritic, GoalAngleCritic,
        PathAlignCritic, PathFollowCritic, PathAngleCritic, TwirlingCritic]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        critical_cost: 300.0
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 0.30
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.40
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
        threshold_to_consider: 0.30
        symmetric_yaw_tolerance: false
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 10.0
        max_path_occupancy_ratio: 0.07
        trajectory_point_step: 2
        threshold_to_consider: 0.30
        offset_from_furthest: 3
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 3
        threshold_to_consider: 0.40
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 2
        threshold_to_consider: 0.30
        max_angle_to_furthest: 1.0
        # Point 2 -> Point 1 should reverse while retaining the nearly identical yaw.
        forward_preference: false
      TwirlingCritic:
        enabled: true
        cost_power: 1
        cost_weight: 10.0
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 10.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base
      transform_tolerance: 0.3
      rolling_window: true
      width: 5
      height: 5
      resolution: 0.05
      # RBY1 mecanum base: x is forward (695 mm), y is left (600 mm).
      footprint: "[[0.3475, 0.3000], [0.3475, -0.3000], [-0.3475, -0.3000], [-0.3475, 0.3000]]"
      footprint_padding: 0.05
      track_unknown_space: true
      plugins: [obstacle_layer, inflation_layer]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          marking: true
          clearing: true
          inf_is_valid: true
          max_obstacle_height: 2.0
          obstacle_max_range: 8.0
          obstacle_min_range: 0.05
          raytrace_max_range: 10.0
          raytrace_min_range: 0.05
          expected_update_rate: 0.5
          observation_persistence: 0.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.75
        cost_scaling_factor: 3.0
      always_send_full_costmap: true
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: vslam_map
      robot_base_frame: base
      transform_tolerance: 0.3
      rolling_window: true
      width: 20
      height: 20
      resolution: 0.05
      # Match the local costmap's physical RBY1 mecanum-base footprint.
      footprint: "[[0.3475, 0.3000], [0.3475, -0.3000], [-0.3475, -0.3000], [-0.3475, 0.3000]]"
      footprint_padding: 0.05
      track_unknown_space: true
      plugins: [obstacle_layer, inflation_layer]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          marking: true
          clearing: true
          inf_is_valid: true
          max_obstacle_height: 2.0
          obstacle_max_range: 8.0
          obstacle_min_range: 0.05
          raytrace_max_range: 10.0
          raytrace_min_range: 0.05
          expected_update_rate: 0.5
          observation_persistence: 0.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.75
        cost_scaling_factor: 3.0
      always_send_full_costmap: true
planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 2.0
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_theta_star_planner/ThetaStarPlanner
      how_many_corners: 8
      w_euc_cost: 1.0
      w_traversal_cost: 2.0
      allow_unknown: false
      use_final_approach_orientation: false
smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: [simple_smoother]
    simple_smoother:
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true
behavior_server:
  ros__parameters:
    use_sim_time: false
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: [spin, backup, wait]
    spin:
      plugin: nav2_behaviors/Spin
    backup:
      plugin: nav2_behaviors/BackUp
    wait:
      plugin: nav2_behaviors/Wait
    global_frame: odom
    robot_base_frame: base
    transform_tolerance: 0.3
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.35
    min_rotational_vel: 0.05
    rotational_acc_lim: 0.4
waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: true
    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint:
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      enabled: true
      waypoint_pause_duration: 0
velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: true
    feedback: CLOSED_LOOP
    # Match MPPI's per-axis model; sqrt(0.12^2 + 0.08^2) < 0.15 m/s.
    max_velocity: [0.12, 0.08, 0.35]
    min_velocity: [-0.10, -0.08, -0.35]
    max_accel: [0.2, 0.2, 0.4]
    max_decel: [-0.2, -0.2, -0.4]
    odom_topic: /rby1/odom
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 0.25
