schema_version: 1
transfer:
  default_min: 5
  override: {}
devices:
  # 임시 mock 입력은 10개 배치가 모두 장비에서 시작한다.
  # 실제 투입 대기 방식이 정해지면 실제 장비 용량으로 되돌려야 한다.
  LH1: {job_capacity: 1, plate_capacity: 10}
  LH2: {job_capacity: 1, plate_capacity: 10}
  ZS: {job_capacity: 1, plate_capacity: 1}
  MPR: {job_capacity: 1, plate_capacity: 1}
  INC: {job_capacity: 5, plate_capacity: 5}
initial_plates: {C: LH1, D: LH2}
workflow:
  - {id: S1, kind: process, roles: [C], produces: [A, B, C], device: LH1, duration_min: 120, after: []}
  - {id: T02, kind: transfer, role: A, source: LH1, destination: ZS, priority: P4, after: [S1]}
  - {id: T03, kind: transfer, role: B, source: LH1, destination: MPR, priority: P4, after: [S1]}
  - {id: S2, kind: process, roles: [A], produces: [A], device: ZS, duration_min: 360, after: [T02]}
  - {id: S3, kind: process, roles: [B], produces: [B], device: MPR, duration_min: 360, after: [T03]}
  - {id: S4, kind: process, roles: [D], produces: [D], device: LH2, duration_min: 120, after: []}
  - {id: T06, kind: transfer, role: D, source: LH2, destination: INC, priority: P3, after: [S4]}
  - {id: S5, kind: process, roles: [D], produces: [D], device: INC, duration_min: 1440, after: [T06]}
  - {id: T07, kind: transfer, role: D, source: INC, destination: LH2, priority: P2, after: [S5]}
  - {id: T08, kind: transfer, role: C, source: LH1, destination: LH2, priority: P3, after: [S1, T07]}
  - {id: S6, kind: process, roles: [C, D], produces: [C, D], device: LH2, duration_min: 180, after: [T07, T08]}
  - {id: T09, kind: transfer, role: D, source: LH2, destination: INC, priority: P3, after: [S6]}
  - {id: T13, kind: transfer, role: C, source: LH2, destination: WASTE, priority: P5, after: [S6]}
  - {id: S7, kind: process, roles: [D], produces: [D], device: INC, duration_min: 1440, after: [T09]}
  - {id: T10, kind: transfer, role: D, source: INC, destination: MPR, priority: P4, after: [S7]}
  - {id: S8, kind: process, roles: [D], produces: [D], device: MPR, duration_min: 180, after: [T10]}
  - {id: T11, kind: transfer, role: A, source: ZS, destination: WASTE, priority: P5, after: [S2]}
  - {id: T12, kind: transfer, role: B, source: MPR, destination: WASTE, priority: P5, after: [S3]}
  - {id: T14, kind: transfer, role: D, source: MPR, destination: WASTE, priority: P5, after: [S8]}
